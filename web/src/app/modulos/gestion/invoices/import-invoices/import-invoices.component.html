<app-modal-ok></app-modal-ok>
<app-modal-msgs></app-modal-msgs>
<div class="modal-backdrop" *ngIf="isVisible">
  <div class="modal-content">  
    <form [formGroup]="formulario" *ngIf="formulario">
      <div class="col-12 grid-margin stretch-card">
        <div class="card">
         
            <h4 class="card-title">          
         
              {{ 'Ecra.manualImport' | translate }}          
            </h4>
                <div class="form-group">
                <label for="Key"> {{ 'Ecra.Key' | translate }} <span class="required">*</span></label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="key"
                  id="key"
                  (keydown.space)="$event.preventDefault()"
                  placeholder="{{ 'Ecra.putKey' | translate }}"
                  [ngClass]="{'is-invalid': formulario.get('key')?.invalid && formulario.get('key')?.touched}"
                />
                <div class="invalid-feedback" *ngIf="formulario.get('key')?.invalid && formulario.get('key')?.touched">
                {{ 'Ecra.requiredFieldKey' | translate }}
                </div>
              </div>  
              <div class="form-group">
                <label for="AirLineCompany"> {{ 'Ecra.AirLineCompany' | translate }} <span class="required">*</span></label>
                  <select 
                    id="companyCode" 
                    formControlName="companyCode" 
                    class="form-select"             
                    [ngClass]="{'is-invalid': formulario.get('companyCode')?.invalid && formulario.get('companyCode')?.touched}">              
                        <option value="" style="font-size: 12px">{{ 'Ecra.selected' | translate }}</option>
                        <option *ngFor="let data of airLInes" [value]="data.code" style="font-size: 12px">{{data.name}}</option>
                  </select>
                <div class="invalid-feedback" *ngIf="formulario.get('companyCode')?.invalid && formulario.get('companyCode')?.touched">
              {{ 'Ecra.requiredFieldAirLineCompany' | translate }} 
                </div>
              </div>
              <div class="form-group">
                <label for="nome"> {{ 'Ecra.billedFlytura' | translate }} <span class="required">*</span></label>
                <input  type="checkbox"  formControlName="flyturaInvoice" class="form-check-input">            
              </div>
              <div class="form-group">
                      <div class="actions-container">
                          <!-- Botão de selecionar Excel -->
                          <button class="action-btn-search action-btn excel-btn" (click)="fileInput.click()">
                            <span class="icon">⬆️</span>
                            {{ 'Ecra.selectInvoicesUpload' | translate }}
                          </button>
                            <input 
                              type="file" 
                              #fileInput 
                              (change)="onFileSelected($event)" 
                              accept=".pdf,.xml"
                              multiple
                              hidden
                            />
                            <div>
                                <span *ngFor="let file of filesForImport; let i = index">
                                  <a href="javascript:void(0)" (click)="removeFile(i)" title="excluir">X</a> Arquivo -> {{ file.name }} <br>                                
                                </span>                          
                            </div>
                      </div>
                  </div>
                  <div class="form-group grid-margin stretch-card" >
                    <div class="card">
                      <div class="card-body">
                          <div style="float: none;">
                          <button class="btn btn-primary me-2" (click)="gravar()">{{ 'Ecra.save' | translate }}</button>
                          <button class="btn btn-light" (click)="cancel()">{{ 'Ecra.cancel' | translate }}</button>
                          </div> 
                      </div>
                    </div>
                  </div>             
      
        </div>
      </div>
        
    </form>
  </div>
</div>
